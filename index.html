<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineMatch — Semantic Film Discovery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #090a0d;
      --surface: #111318;
      --surface-elevated: #161922;
      --surface-hover: #1c202c;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.18);
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --text-tertiary: #6b7280;
      --accent: #e5e7eb;
      --accent-bg: #1f2430;
      --match-bg: rgba(52, 211, 153, 0.08);
      --match-border: rgba(52, 211, 153, 0.25);
      --match-text: #34d399;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    /* Header */
    header {
      padding: 18px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(9, 10, 13, 0.85);
      backdrop-filter: blur(16px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-hover);
      border-radius: var(--radius-sm);
      background: var(--surface-elevated);
      color: var(--text-primary);
    }

    .brand-logo svg {
      width: 15px;
      height: 15px;
    }

    .brand-title {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .brand-tag {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-tertiary);
      border-left: 1px solid var(--border);
      padding-left: 12px;
      margin-left: 2px;
    }

    /* Hero / Search Section */
    .hero {
      text-align: center;
      padding: 72px 24px 44px;
      max-width: 760px;
      margin: 0 auto;
    }

    .hero-eyebrow {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 12px;
      display: inline-block;
    }

    .hero h1 {
      font-size: 2.5rem;
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 1.15;
      margin-bottom: 14px;
      color: #fff;
    }

    .hero p {
      color: var(--text-secondary);
      font-size: 1.02rem;
      margin-bottom: 32px;
      font-weight: 400;
    }

    /* Search Input Container */
    .search-container {
      position: relative;
      max-width: 620px;
      margin: 0 auto 20px;
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      pointer-events: none;
    }

    .search-icon svg {
      width: 18px;
      height: 18px;
    }

    .search-input {
      width: 100%;
      padding: 15px 115px 15px 48px;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text-primary);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .search-input::placeholder {
      color: var(--text-tertiary);
    }

    .search-input:focus {
      border-color: var(--border-hover);
      box-shadow: 0 0 0 1px var(--border-hover);
    }

    .search-btn {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      padding: 8px 18px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      color: #0b0c10;
      background: #f3f4f6;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .search-btn:hover {
      background: #ffffff;
    }

    /* Search Preset Chips */
    .chips {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      background: transparent;
      border: 1px solid var(--border);
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip:hover {
      background: var(--surface-elevated);
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    /* Main Catalog */
    main {
      flex: 1;
      max-width: 1360px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 48px 80px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .catalog-count {
      color: var(--text-tertiary);
      font-weight: 400;
    }

    .reset-btn {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: none;
      transition: all 0.15s ease;
    }

    .reset-btn:hover {
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    /* Grid */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 24px;
    }

    /* Movie Card */
    .movie-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s ease, transform 0.2s ease;
      position: relative;
    }

    .movie-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-3px);
    }

    .poster-container {
      position: relative;
      width: 100%;
      height: 340px;
      background: #0d0f14;
      overflow: hidden;
    }

    .movie-poster {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .movie-card:hover .movie-poster {
      transform: scale(1.02);
    }

    .score-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(17, 19, 24, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid var(--match-border);
      color: var(--match-text);
      font-weight: 600;
      font-size: 0.75rem;
      letter-spacing: 0.02em;
      padding: 3px 8px;
      border-radius: var(--radius-sm);
      font-variant-numeric: tabular-nums;
    }

    .movie-info {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .movie-title {
      font-size: 0.98rem;
      font-weight: 600;
      letter-spacing: -0.015em;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }

    .movie-desc {
      color: var(--text-secondary);
      font-size: 0.82rem;
      line-height: 1.5;
      margin-bottom: 16px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }

    .similar-btn {
      width: 100%;
      padding: 8px 12px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .similar-btn svg {
      width: 13px;
      height: 13px;
      transition: transform 0.15s ease;
    }

    .similar-btn:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
      color: var(--text-primary);
    }

    .similar-btn:hover svg {
      transform: translateX(2px);
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 24px;
      animation: fadeIn 0.15s ease-out;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: var(--surface);
      border: 1px solid var(--border-hover);
      border-radius: var(--radius-lg);
      max-width: 860px;
      width: 100%;
      padding: 28px;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s ease;
    }

    .modal-close:hover {
      color: var(--text-primary);
      border-color: var(--border-hover);
    }

    .modal-close svg {
      width: 14px;
      height: 14px;
    }

    .modal-header {
      margin-bottom: 22px;
    }

    .modal-eyebrow {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-tertiary);
      margin-bottom: 4px;
    }

    .modal-header h3 {
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 18px;
    }

    /* Loading & Status States */
    .loading-state {
      text-align: center;
      padding: 80px 20px;
      grid-column: 1 / -1;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--text-primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 14px;
    }

    .status-text {
      color: var(--text-tertiary);
      font-size: 0.88rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @media (max-width: 768px) {
      header { padding: 16px 20px; }
      main { padding: 20px; }
      .hero { padding: 48px 16px 32px; }
      .hero h1 { font-size: 1.85rem; }
    }
  </style>
</head>
<body>

  <!-- Minimal Header -->
  <header>
    <a href="#" class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
          <line x1="7" y1="2" x2="7" y2="22"></line>
          <line x1="17" y1="2" x2="17" y2="22"></line>
          <line x1="2" y1="12" x2="22" y2="12"></line>
        </svg>
      </div>
      <span class="brand-title">CineMatch</span>
      <span class="brand-tag">Vector Discovery</span>
    </a>
  </header>

  <!-- Editorial Search Section -->
  <section class="hero">
    <span class="hero-eyebrow">Natural Language Discovery</span>
    <h1>Semantic Film Search</h1>
    <p>Search movie plots, emotional themes, and narrative concepts using dense vector embeddings.</p>

    <div class="search-container">
      <div class="search-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      <input 
        type="text" 
        id="searchInput" 
        class="search-input" 
        placeholder="Search by theme (e.g., astronauts fighting for survival in deep space)..." 
      />
      <button id="searchBtn" class="search-btn">Search</button>
    </div>

    <!-- Clean, Non-Emoji Filter Chips -->
    <div class="chips">
      <button class="chip" onclick="handleChipClick('Astronauts stranded in deep space')">Space Exploration</button>
      <button class="chip" onclick="handleChipClick('Mind-bending dreams and simulated realities')">Surrealist Sci-Fi</button>
      <button class="chip" onclick="handleChipClick('Relentless assassin hunting for vengeance')">Action & Revenge</button>
      <button class="chip" onclick="handleChipClick('Dark gritty detective psychological thriller')">Neo-Noir Crime</button>
    </div>
  </section>

  <!-- Movies Catalog -->
  <main>
    <div class="section-header">
      <h2 id="sectionTitle" class="section-title">
        <span>Catalog</span>
        <span id="catalogCount" class="catalog-count">(25)</span>
      </h2>
      <button id="resetBtn" class="reset-btn" onclick="loadAllMovies()">Show Full Catalog</button>
    </div>

    <div id="movieGrid" class="movie-grid">
    </div>
  </main>

  <!-- Recommendation Modal -->
  <div id="similarModal" class="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div class="modal-header">
        <div class="modal-eyebrow">Recommendations</div>
        <h3 id="modalTitle">Similar Titles</h3>
      </div>
      <div id="modalGrid" class="modal-grid">
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = "http://localhost:8080/api/v1/movies";

    const movieGrid = document.getElementById("movieGrid");
    const searchInput = document.getElementById("searchInput");
    const searchBtn = document.getElementById("searchBtn");
    const sectionTitle = document.getElementById("sectionTitle");
    const catalogCount = document.getElementById("catalogCount");
    const resetBtn = document.getElementById("resetBtn");
    const similarModal = document.getElementById("similarModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalGrid = document.getElementById("modalGrid");

    async function loadAllMovies() {
      showLoading(movieGrid);
      resetBtn.style.display = "none";
      sectionTitle.firstElementChild.textContent = "Catalog";

      try {
        const response = await fetch(`${API_BASE_URL}/`);
        if (!response.ok) throw new Error("Could not fetch catalog");
        
        const data = await response.json();
        renderMovies(data.movies, false);
        catalogCount.textContent = `(${data.movies.length})`;
      } catch (err) {
        showError(movieGrid, "FastAPI server unavailable. Ensure the backend is running on port 8080.");
      }
    }

    async function searchMovies() {
      const query = searchInput.value.trim();
      if (!query) return;

      showLoading(movieGrid);
      resetBtn.style.display = "block";
      sectionTitle.firstElementChild.textContent = `Results for "${query}"`;
      catalogCount.textContent = "";

      try {
        const response = await fetch(`${API_BASE_URL}/search?query=${encodeURIComponent(query)}`);
        if (!response.ok) throw new Error("Search failed");

        const data = await response.json();
        renderMovies(data.movies, true);
        catalogCount.textContent = `(${data.movies.length})`;
      } catch (err) {
        showError(movieGrid, "Search query failed. Please verify API status.");
      }
    }

    async function openSimilarModal(movieTitle) {
      similarModal.classList.add("active");
      modalTitle.textContent = `Titles similar to "${movieTitle}"`;
      showLoading(modalGrid);

      try {
        const response = await fetch(`${API_BASE_URL}/${encodeURIComponent(movieTitle)}/similar`);
        if (!response.ok) throw new Error("Could not find recommendations");

        const data = await response.json();
        renderModalMovies(data.movies);
      } catch (err) {
        showError(modalGrid, `No similarity vectors found for "${movieTitle}"`);
      }
    }

    function closeModal() {
      similarModal.classList.remove("active");
    }

    window.addEventListener("click", (e) => {
      if (e.target === similarModal) closeModal();
    });
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    function renderMovies(movies, showScore = false) {
      if (!movies || movies.length === 0) {
        movieGrid.innerHTML = `
          <div class="loading-state">
            <p class="status-text">No matching records found in vector catalog.</p>
          </div>
        `;
        return;
      }

      movieGrid.innerHTML = movies.map(movie => {
        const scorePercent = movie.similarity_score ? Math.round(movie.similarity_score * 100) : null;
        const scoreBadge = scorePercent 
          ? `<span class="score-badge">${scorePercent}% match</span>` 
          : "";

        return `
          <div class="movie-card">
            <div class="poster-container">
              <img src="${movie.imageUrl}" alt="${movie.title}" class="movie-poster" loading="lazy">
              ${scoreBadge}
            </div>
            <div class="movie-info">
              <h3 class="movie-title">${movie.title}</h3>
              <p class="movie-desc">${movie.description}</p>
              <button class="similar-btn" onclick="openSimilarModal('${movie.title.replace(/'/g, "\\'")}')">
                <span>Similar Titles</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </button>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderModalMovies(movies) {
      if (!movies || movies.length === 0) {
        modalGrid.innerHTML = `<p class="status-text">No recommendations available for this record.</p>`;
        return;
      }

      modalGrid.innerHTML = movies.map(movie => {
        const scorePercent = movie.similarity_score ? Math.round(movie.similarity_score * 100) : 0;
        return `
          <div class="movie-card" style="box-shadow: none;">
            <div class="poster-container" style="height: 260px;">
              <img src="${movie.imageUrl}" alt="${movie.title}" class="movie-poster">
              <span class="score-badge">${scorePercent}% match</span>
            </div>
            <div class="movie-info" style="padding: 14px;">
              <h4 class="movie-title">${movie.title}</h4>
              <p class="movie-desc" style="-webkit-line-clamp: 2;">${movie.description}</p>
            </div>
          </div>
        `;
      }).join("");
    }

    function showLoading(element) {
      element.innerHTML = `
        <div class="loading-state">
          <div class="spinner"></div>
          <p class="status-text">Computing vector similarities...</p>
        </div>
      `;
    }

    function showError(element, message) {
      element.innerHTML = `
        <div class="loading-state">
          <p style="color: #f87171; font-weight: 500; font-size: 0.9rem; margin-bottom: 4px;">Service Disconnected</p>
          <p class="status-text">${message}</p>
        </div>
      `;
    }

    function handleChipClick(text) {
      searchInput.value = text;
      searchMovies();
    }

    searchBtn.addEventListener("click", searchMovies);
    searchInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") searchMovies();
    });

    loadAllMovies();
  </script>
</body>
</html>
